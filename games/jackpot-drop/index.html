<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e2a">
  <title>Jackpot Drop</title>
  <link rel="stylesheet" href="styles.css?v=build-23">
</head>
<body>
  <main class="cabinet" aria-label="Jackpot Drop">
    <header class="top-controls">
      <a class="machine-button" href="../../" aria-label="포트폴리오 홈">홈</a>
      <h1>Jackpot Drop</h1>
      <button class="machine-button" id="pause" type="button" aria-label="일시 정지" aria-haspopup="dialog" aria-controls="pause-menu" aria-expanded="false">정지</button>
      <button class="machine-button sound" id="sound" type="button" aria-label="음소거" aria-pressed="false">
        <span class="sound-icon" aria-hidden="true"></span><span id="sound-label">소리 켬</span>
      </button>
    </header>

    <div class="playfield">
      <div class="board">
        <canvas id="game" width="440" height="640" tabindex="0" aria-label="잭팟 드롭 보드" aria-description="보드를 누른 채 좌우로 끌어 조준하고 떼면 발사합니다. 키보드는 왼쪽과 오른쪽 방향키로 조준하고 Space 또는 Enter를 눌렀다 떼서 발사합니다. 위아래 방향키로 장전 구슬을 고릅니다. 비행 중에는 보드나 Shift를 누르는 동안 2배속으로 진행합니다. 정산은 보드를 탭하거나 Space 또는 Enter로 건너뜁니다."></canvas>
        <div id="magazine" class="magazine" role="group" aria-label="구슬 탄창" hidden></div>
        <div id="panel-controls" class="panel-controls" role="group" hidden></div>
      </div>
    </div>
  </main>
  <dialog id="pause-menu" class="game-menu" aria-labelledby="pause-title">
    <h2 id="pause-title">일시 정지</h2>
    <div class="menu-options" id="pause-options">
      <button class="machine-button menu-primary" id="resume" type="button" autofocus>계속</button>
      <button class="machine-button" id="open-map" type="button">스테이지 지도</button>
      <button class="machine-button" id="ask-reset" type="button">처음부터</button>
      <a class="machine-button" href="../../">포트폴리오</a>
    </div>
    <div class="menu-options" id="reset-options" hidden>
      <p id="reset-warning">코인과 강화가 모두 사라집니다. 1단계부터 다시 할까요?</p>
      <button class="machine-button menu-danger" id="confirm-reset" type="button">다시 시작</button>
      <button class="machine-button menu-primary" id="cancel-reset" type="button">취소</button>
    </div>
  </dialog>
  <script src="src/rules.js?v=build-23" defer></script>
  <script src="src/game.js?v=build-23" defer></script>
  <script src="src/audio.js?v=build-23" defer></script>
  <script src="src/fx.js?v=build-23" defer></script>
  <script src="src/render.js?v=build-23" defer></script>
  <script src="src/input.js?v=build-23" defer></script>
  <script src="src/main.js?v=build-23" defer></script>
</body>
</html>
