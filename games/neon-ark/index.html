<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080c19">
<meta name="description" content="앞줄 색을 보고 같은 색 셔틀을 터치하세요. 3명 만석이면 출발! 제한된 탑승장과 누적 강화로 9개 항로를 완주하는 우주 수송 퍼즐.">
<title>NEON ARK · 네온 아크</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="preload" href="assets/fonts/Jua-Regular.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="transport.css">
</head><body class="game-page transport-mode">
<div class="starfield" aria-hidden="true"></div>
<main class="game-app">

<section class="game-shell" aria-label="네온 아크 게임">
<div class="game-top"><h1 id="sector-label">항로 1/9</h1><span id="sector-name" class="sr-only">첫 번째 신호</span><div class="controls"><button id="help" aria-label="플레이 방법">?</button><button id="pause" aria-label="일시 정지">Ⅱ</button><button id="menu" aria-label="원정 메뉴 열기">≡</button></div></div>
<div id="arena" class="arena">
<div class="survey-scene"><div class="survey-copy"><span>출발</span><b id="survey-count">0 / 9</b><div class="survey-track"><i id="survey-bar"></i></div></div><div id="planet" class="survey-planet" aria-hidden="true"><img id="planet-sprite" src="assets/kenney/planet-cyan.png" width="384" height="384" alt="" decoding="async"><span class="orbit-track"></span></div><span id="planet-label" class="planet-label">목적지</span><div class="survey-chain"><div class="hull-readout"><span>선체</span><strong id="hull">3 / 3</strong><div id="hull-pips" class="hull-pips" aria-label="현재 선체 3, 최대 3"></div></div></div><span class="sr-only" id="risk-label">도크 포화 → 선체 −1</span></div>
<div id="puzzle-area">
<div class="crew-line"><div class="crew-label"><span>앞줄</span><b id="next-color">파랑</b><span id="crew-count" class="sr-only">27</span></div><div id="crew" class="crew" aria-label="앞줄부터 차례로 탑승하는 대기열"></div><span id="queue-hidden" class="queue-end">+21</span></div>
<p id="queue-forecast" class="sr-only">앞 6명 관측 · 순서대로 탑승</p>
<div class="dock-row"><span class="dock-caption">탑승장</span><span id="dock-free" class="dock-free">빈칸 3</span><div id="docks" class="docks" aria-label="탐사대 탑승 도크"></div></div><p id="dock-warning" class="sr-only" hidden>마지막 도크 · 포화 시 선체 −1</p>
<div class="hangar-label"><span>셔틀 <b id="ships-left">09</b></span><span id="move-hint">화살표 쪽으로 출차</span></div>
<div class="hangar"><div id="board" class="board" role="group" aria-label="격납고 탐사정 퍼즐"></div></div>
</div>
<section id="upgrade-choice" class="upgrade-choice" aria-label="항로 클리어와 강화 선택" hidden></section>
<div id="fx" class="fx" aria-hidden="true"></div><div id="hit-label" class="hit-label" aria-hidden="true"></div>
</div>
<p id="message" class="message" role="status" aria-live="polite">같은 색 3명 → 출항</p>
<div class="game-bottom"><button id="undo" disabled>↶ 회항 1</button><button id="restart" aria-label="탐사 중단 · 선체 1 소모">귀환 −1</button></div>
</section>
</main>
<dialog id="mission" aria-labelledby="mission-title"><button id="mission-close" class="modal-close" aria-label="원정 메뉴 닫기">×</button><h2 id="mission-title">원정 메뉴</h2><div class="menu-actions"><button id="resume" class="primary">계속</button><button id="sound" class="secondary" aria-label="효과음 끄기" aria-pressed="true">효과음 켜짐</button></div>
<section class="panel telemetry"><h3>이번 항로</h3><div class="telemetry-row"><span>대원</span><b id="deployed">0 / 27명</b></div><div class="telemetry-row"><span>점수</span><b id="score">0</b></div><div class="telemetry-row"><span>연속 출항</span><b id="combo">×0</b></div><p id="chain-label" class="chain-note">점수 보너스</p><div class="telemetry-row"><span>회항</span><b id="undo-output">1 / 1회</b></div><div class="telemetry-row"><span>관측</span><b id="preview-output">앞 6명</b></div><div class="telemetry-row"><span>빈 도크</span><b id="dock-capacity">3칸</b></div><div class="telemetry-row"><span>누적 점수</span><b id="run-score">0</b></div><button id="new-run" class="new-run secondary">새 원정</button></section>
<section class="panel build-guide"><h2>강화 <b id="upgrade-count">0</b></h2><p>눌러서 효과 보기</p><div id="build-list" class="build-list"></div><p class="build-footnote">원정 동안 유지</p></section>
<details class="panel record-panel"><summary>기록</summary><div class="route" id="route"></div><div class="mission-bottom"><span>최고 항로</span><strong id="best-stage">01</strong></div><p id="legacy-record" class="legacy-record"></p></details>
<nav class="menu-links" aria-label="게임 밖으로"><a href="../../#play">홈</a><a href="design.html">게임 설계 · 출처</a></nav></dialog>
<dialog id="modal" aria-labelledby="modal-title"><button id="modal-close" class="modal-close" aria-label="닫기">×</button><div id="modal-content"></div></dialog><script type="module" src="game.mjs"></script>
</body></html>
