<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#201536"><meta name="description" content="같은 색 출구로 블록을 밀어 탈출! 여섯 가지 퍼즐과 다섯 부스터를 휴대폰에서 바로 플레이하세요.">
<title>블록 블룸 — 컬러를 터뜨려!</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="preload" href="assets/fonts/bloom-ui.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<main class="game-shell" aria-label="블록 블룸">
<header class="game-header"><button class="mode-switch" id="mode-open" aria-label="모드 선택"><span id="mode-title">컬러 탈출</span><span class="level-badge" id="level-badge" aria-label="레벨 1">1</span><span class="mode-chevron" aria-hidden="true">⌄</span></button><button class="icon-button" id="help" aria-label="플레이 방법"><img src="assets/icons/question.png" alt="" width="24" height="24"></button><button class="icon-button" id="pause" aria-label="일시 정지"><img src="assets/icons/pause.png" alt="" width="24" height="24"></button></header>
<section class="hud" aria-label="현재 상태"><div class="timer" id="timer"><span class="hud-label">남은 시간 <span id="freeze-time"></span></span><strong id="time">03:00</strong></div><div class="hud-goal"><span class="hud-label"><span class="normal-goal">탈출</span><span id="fever-banner" hidden>피버 ×2</span></span><strong id="cleared">0 / 8</strong></div><button class="wallet" id="shop-open" aria-label="코인 상점"><span class="hud-label"><span class="coin" aria-hidden="true">✦</span> 코인 ＋</span><strong id="coins">350</strong></button></section>
<section class="play-space" aria-label="플레이 영역">
<div class="board-stage" id="board-stage"><div class="board-aura" aria-hidden="true"></div><div class="board-frame" id="board-frame"><div class="gates" id="gates" aria-label="색상별 출구"></div><div class="board" id="board" aria-label="6×6 퍼즐 보드"><div class="board-grid" aria-hidden="true"></div><div id="platforms" aria-hidden="true"></div><div id="blocks"></div><div id="hint-arrow" aria-hidden="true" hidden></div></div></div><div id="fx-layer" aria-hidden="true"></div><div id="combo-label" class="combo-label" aria-live="polite"></div></div>
<div class="dock" id="dock" hidden aria-label="7칸 수집함"><span id="reserve-count">수집</span><div id="dock-slots"></div></div>
<div class="factory-bar" id="factory-bar" hidden><span>생성 <b id="queue-count">4</b></span><div id="queue-preview" aria-label="대기 블록"></div></div>
<div class="input-row"><span class="sr-only" id="instruction" role="status">같은 색 출구로 블록을 밀어주세요.</span><span class="sr-only" id="combo-count" aria-live="off"></span><div class="direction-pad" aria-label="선택 블록 이동"><button data-direction="0,-1" aria-label="위로 이동"><img src="assets/icons/arrowUp.png" alt="" width="22" height="22"></button><button data-direction="-1,0" aria-label="왼쪽으로 이동"><img src="assets/icons/arrowLeft.png" alt="" width="22" height="22"></button><button data-direction="0,1" aria-label="아래로 이동"><img src="assets/icons/arrowDown.png" alt="" width="22" height="22"></button><button data-direction="1,0" aria-label="오른쪽으로 이동"><img src="assets/icons/arrowRight.png" alt="" width="22" height="22"></button></div><button class="lift-button" id="lift" hidden>승강기 ⇅</button></div>
</section>
<nav class="items" id="items" aria-label="즉시 사용 아이템"></nav>
</main>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="modal" aria-labelledby="modal-title"><button class="modal-close" id="modal-close" aria-label="닫기">×</button><div id="modal-content"></div></dialog>
<script type="module" src="game.mjs?v=2"></script>
</body></html>
